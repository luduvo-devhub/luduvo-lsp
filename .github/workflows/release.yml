name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package"
        required: true
        type: string

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --draft --verify-tag
          fi

  api-docs:
    name: Package Luduvo API documentation
    needs: ["create-release"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create API documentation archive
        working-directory: scripts/luduvo
        run: zip -r "$GITHUB_WORKSPACE/luduvo-api-docs.zip" api-docs

      - name: Upload API documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: luduvo-api-docs
          path: ./luduvo-api-docs.zip

      - name: Upload API documentation to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ./luduvo-api-docs.zip --clobber --repo "$GITHUB_REPOSITORY"

  dist:
    needs: ["create-release"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: luduvo-lsp-win64
            code-target: [win32-x64, win32-arm64]
            crash-reporting: false
          - os: ubuntu-22.04
            artifact-name: luduvo-lsp-linux-x86_64
            code-target: [linux-x64]
            crash-reporting: false
          - os: ubuntu-22.04-arm
            artifact-name: luduvo-lsp-linux-arm64
            code-target: [linux-arm64]
            crash-reporting: false
          - os: macos-latest
            artifact-name: luduvo-lsp-macos
            code-target: [darwin-x64, darwin-arm64]
            crash-reporting: false

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Build Server
        shell: bash
        run: |
          mkdir build && cd build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
            cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_STATIC_CRT:BOOL=ON -DLSP_BUILD_WITH_SENTRY:BOOL=${{ matrix.crash-reporting }} '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
          else
            cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_STATIC_CRT:BOOL=ON -DLSP_BUILD_WITH_SENTRY:BOOL=${{ matrix.crash-reporting }}
          fi
          cmake --build . --config RelWithDebInfo --target Luau.LanguageServer.CLI -j 3

      - name: (MacOS) Verify universal build
        if: matrix.os == 'macos-latest'
        run: lipo -archs build/luduvo-lsp

      - name: (MacOS) Separate debug symbols
        if: matrix.os == 'macos-latest'
        run: dsymutil build/luduvo-lsp && strip -S build/luduvo-lsp

      - name: (Linux) Separate debug symbols
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
        run: objcopy --only-keep-debug build/luduvo-lsp build/luduvo-lsp.dbg && objcopy --strip-debug build/luduvo-lsp

      - name: Copy Build into Extension
        shell: bash
        run: |
          mkdir -p ./dist
          mkdir -p editors/code/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/RelWithDebInfo/luduvo-lsp.exe editors/code/bin/server.exe
          else
            cp build/luduvo-lsp editors/code/bin/server
            chmod 777 editors/code/bin/server
          fi

      - name: Copy Crashpad Handler into Extension
        shell: bash
        if: matrix.crash-reporting == true
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp build/RelWithDebInfo/crashpad_handler.exe editors/code/bin/crashpad_handler.exe
          else
              cp build/crashpad_handler editors/code/bin/crashpad_handler
              chmod 777 editors/code/bin/crashpad_handler
          fi

      - name: Create Release Archive
        shell: bash
        run: |
          mkdir staging
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "build/RelWithDebInfo/luduvo-lsp.exe" staging/
            cd staging
            7z a "../dist/${{ matrix.artifact-name }}.zip" *
          else
            cp "build/luduvo-lsp" staging/
            cd staging
            zip "../dist/${{ matrix.artifact-name }}.zip" *
          fi

      - name: Copy README, CHANGELOG, LICENSE
        shell: bash
        run: |
          rm -f editors/code/README.md
          cp README.md editors/code/README.md
          rm -f editors/code/CHANGELOG.md
          cp CHANGELOG.md editors/code/CHANGELOG.md
          rm -f editors/code/LICENSE.md
          cp LICENSE.md editors/code/LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact-name }}
          path: ./dist

      - name: Upload Server to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "./dist/${{ matrix.artifact-name }}.zip" --clobber --repo "$GITHUB_REPOSITORY"
