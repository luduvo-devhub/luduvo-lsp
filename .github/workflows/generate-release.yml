name: Generate new release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver Base Version (major.minor.patch. The L will be added on its own so don't include it)"
        required: true
        type: string
      prerelease:
        description: "Make the release a prerelease and mark it as alpha?"
        required: true
        default: false
        type: boolean

jobs:
  generate-release:
    name: Generate new release
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TYPES_GENERATOR_APP_ID }}
          private-key: ${{ secrets.TYPES_GENERATOR_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          submodules: true
      - name: Configure git details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Test release version generation
        run: python3 -m unittest scripts/test_release.py
      - name: Create release commit and tag
        env:
          BASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            scripts/release.py "$BASE_VERSION" --prerelease
          else
            scripts/release.py "$BASE_VERSION"
          fi
