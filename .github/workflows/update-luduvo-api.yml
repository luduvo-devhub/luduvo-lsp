name: Update Luduvo API

on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *" # Runs at 00:25 UTC every day
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/update-luduvo-api.yml"
      - "scripts/luduvo/*.py"
      - "scripts/luduvo/api-docs/en-us/*-overrides.json"

concurrency:
  group: update-luduvo-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TYPES_GENERATOR_APP_ID }}
          private-key: ${{ secrets.TYPES_GENERATOR_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Refresh Luduvo API, types, and documentation
        run: python scripts/luduvo/dumpLuduvoApi.py --generate

      - name: Create Pull Request
        id: create_pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Update Luduvo API types and documentation
          body: |
            Refreshes the Luduvo API snapshot, component names, generated Luau types, and documentation.
            - This pull request is **auto-generated**
          branch: auto/update-luduvo-api
          commit-message: Update Luduvo API types and documentation
          base: main
          token: ${{ steps.generate_token.outputs.token }}

      - name: Enable Pull Request Automerge
        if: steps.create_pull_request.outputs.pull-request-number != ''
        run: gh pr merge --squash --auto "${{ steps.create_pull_request.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
