name: Verify Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  python_tests:
    name: Test Luduvo API generators
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Run generator tests
        run: python -m unittest discover -s scripts/luduvo/tests

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    name: Build Server (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_STATIC_CRT:BOOL=ON
          cmake --build . --target Luau.LanguageServer.CLI -j 3

  run_tests:
    env:
      SCCACHE_GHA_ENABLED: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test-path: ./build/Luau.LanguageServer.Test.exe
            editor-smoke: true
            smoke-runner: build/luduvo-context-editor-smoke.exe
          - os: ubuntu-24.04
            test-path: ./build/Luau.LanguageServer.Test
            editor-smoke: true
            smoke-runner: build/luduvo-context-editor-smoke
          - os: macos-latest
            test-path: ./build/Luau.LanguageServer.Test
            editor-smoke: true
            smoke-runner: build/luduvo-context-editor-smoke

    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set up MSVC for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Configure optimized tests with assertions
        shell: bash
        env:
          # Keep Git Bash from rewriting MSVC flags such as /O2 as file paths.
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          options=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then
            python=python
            # Embedded debug information makes individual MSVC objects cacheable.
            options+=(-DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded)
            flags='/O2 /Ob1 /UNDEBUG'
          else
            options+=(-DLSP_BUILD_ASAN=ON)
            flags='-O1 -g1 -fno-omit-frame-pointer -UNDEBUG'
          fi
          options+=("-DCMAKE_C_FLAGS_RELWITHDEBINFO=$flags" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=$flags")
          if [ "$RUNNER_OS" = macOS ]; then
            # Only tests use the native architecture; release builds remain universal.
            options+=("-DCMAKE_OSX_ARCHITECTURES=$(uname -m)")
          fi
          "$python" - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'CMAKE_BUILD_PARALLEL_LEVEL={os.cpu_count() or 1}\n')
          PY
          cmake -S . -B build "${options[@]}"

      - name: Build Tests
        run: cmake --build build --target Luau.LanguageServer.Test

      - name: Run Tests (Old Solver)
        run: ${{ matrix.test-path }}

      - name: Run Tests (New Solver)
        run: ${{ matrix.test-path }} --new-solver

      - name: Run Tests (All FFlags enabled)
        run: ${{ matrix.test-path }} --fflags=true

      - name: Install real-editor smoke test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libopengl0 libgl1-mesa-dri mesa-vulkan-drivers \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      - name: Check real macOS editor GPU support
        if: runner.os == 'macOS'
        id: editor-gpu
        run: |
          supported=$(swift - <<'SWIFT'
          import Metal
          if #available(macOS 13.0, *) {
              print(MTLCopyAllDevices().contains { $0.supportsFamily(.metal3) } ? "true" : "false")
          } else {
              print("false")
          }
          SWIFT
          )
          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          if [ "$supported" = false ]; then
            echo "::warning::Skipping the real macOS editor smoke test: this runner has no Metal 3 GPU, which LuduvoEditor requires."
            echo "### Real macOS editor smoke test skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "This runner has no Metal 3 GPU, which LuduvoEditor requires. The C++ test suites ran normally." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build real-editor smoke test runner
        if: matrix.editor-smoke && (runner.os != 'macOS' || steps.editor-gpu.outputs.supported == 'true')
        run: cmake --build build --target Luau.LanguageServer.ContextSmoke

      - name: Test real Linux Luduvo editor autodumping
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/luduvo/smokeContextEditor.py \
            --runner "${{ matrix.smoke-runner }}" \
            --work-directory "$RUNNER_TEMP/luduvo-editor-smoke"

      - name: Test real Windows Luduvo editor autodumping
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: |
          python scripts/luduvo/smokeContextEditor.py `
            --runner "${{ matrix.smoke-runner }}" `
            --work-directory "$env:RUNNER_TEMP/luduvo-editor-smoke"

      - name: Test real macOS Luduvo editor autodumping
        if: runner.os == 'macOS' && steps.editor-gpu.outputs.supported == 'true'
        timeout-minutes: 6
        run: |
          python3 scripts/luduvo/smokeContextEditor.py \
            --runner "${{ matrix.smoke-runner }}" \
            --work-directory "$RUNNER_TEMP/luduvo-editor-smoke"

      - name: Upload real-editor smoke test diagnostics
        if: always() && matrix.editor-smoke
        uses: actions/upload-artifact@v4
        with:
          name: luduvo-editor-smoke-diagnostics-${{ runner.os }}
          path: |
            ${{ runner.temp }}/luduvo-editor-smoke/**/*.log
            ${{ runner.temp }}/luduvo-editor-smoke/release.json
            ${{ runner.temp }}/luduvo-editor-smoke/bootstrap.txt
            ${{ runner.temp }}/luduvo-editor-smoke/world.dump.txt
            ${{ runner.temp }}/luduvo-editor-smoke/project/project.json
          if-no-files-found: ignore
          retention-days: 7

  types_smoketest:
    name: Types Smoketest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_BUILD_ASAN:BOOL=ON
          cmake --build . --target Luau.LanguageServer.CLI -j 3

      - name: Regenerate Types
        run: |
          cd scripts
          python dumpRobloxTypes.py > globalTypes.d.luau

      - name: Test types
        run: |
          touch test.lua
          build/luduvo-lsp analyze --defs=scripts/globalTypes.d.luau test.lua

      - name: Test Remodel types
        run: |
          touch remodel_test.lua
          build/luduvo-lsp analyze --defs=scripts/remodel.d.lua test.lua

  lint_extension:
    name: Lint Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: editors/code
      - name: Run ESLint
        run: npm run lint
        working-directory: editors/code
      - name: Prettier
        run: npm run check:format
        working-directory: editors/code

  build_extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    name: Test Extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: editors/code
      - name: Compile and test extension
        run: xvfb-run -a npm test
        working-directory: editors/code
        if: runner.os == 'Linux'
      - name: Compile and test extension
        run: npm test
        working-directory: editors/code
        if: runner.os != 'Linux'
      - name: Verify VSIX packaging
        run: npm exec -- vsce package --target "${{ matrix.target }}" --out "luduvo-lsp-${{ matrix.target }}.vsix"
        working-directory: editors/code

  selene:
    name: Run selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: selene .

  stylua:
    name: Run stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: stylua --check .

  build_plugin:
    name: Verify and Build Roblox Studio Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ok-nick/setup-aftman@v0.4.2

      - name: Generate sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json
        working-directory: plugin

      - name: Build Tool
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DLSP_BUILD_ASAN:BOOL=ON
          cmake --build . --target Luau.LanguageServer.CLI -j 3

      - name: Run Luau Analyze (Plugin Source)
        run: ../build/luduvo-lsp analyze --platform=roblox --sourcemap=sourcemap.json --definitions=../scripts/globalTypes.d.luau src
        working-directory: plugin

      - name: Run Luau Analyze (Cloud Scripts)
        run: |
          lune setup
          echo '{ "aliases": { "lune": "'"$HOME"'/.lune/.typedefs/0.8.9" } }' > .luaurc
          rojo sourcemap test.project.json --output test-sourcemap.json
          ../build/luduvo-lsp analyze --platform=roblox --sourcemap=test-sourcemap.json --definitions=../scripts/globalTypes.d.luau --flag:LuauFixIndexerSubtypingOrdering=True cloud
        working-directory: plugin

      - name: Build Plugin
        run: rojo build plugin --output Luau.rbxm
